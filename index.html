<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffe6f0">
    <link rel="icon" href="/img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="manifest" href="/img/site.webmanifest">
    <!-- Feuille de style principale -->
    <link rel="stylesheet" href="style.css">
    <title>CirclePlay</title>
</head>

<body>
    <!-- Logo et zone où les écrans du menu sont affichés -->
    <div>
        <div id="top-logo">
            <img id="image-logo" src="img/CirclePlay.png" alt="Logo">
        </div>

        <div id="account-indicator" role="status" aria-live="polite" hidden></div>

        <div id="menu">
            <div id="menu-content">
                <h2>Menu Principal</h2>
                <button onclick="menuDevice()">Jeux 🎮</button>
                <button onclick="showProfile()">Profil ⚙️</button>
                <button onclick="showCredits()">Crédits 👑</button>
            </div>
        </div>

        <aside id="game-rules-panel" aria-label="Règles du jeu" hidden>
            <header class="game-rules-header">
                <div>
                    <h2 id="game-rules-title">Règles du jeu</h2>
                    <p id="game-rules-subtitle"></p>
                </div>
                <button id="game-rules-toggle" type="button" aria-expanded="true"
                    aria-label="Réduire les règles">−</button>
            </header>
            <div id="game-rules-body" class="game-rules-body">
            </div>
        </aside>

        <aside id="global-chat" aria-label="Chat global" hidden>
            <header class="chat-header">
                <div class="chat-heading">
                    <h2>Chat global</h2>
                    <p id="chat-presence" aria-live="polite">Connexion...</p>
                </div>
                <button id="chat-toggle" type="button" aria-expanded="true" aria-label="Réduire le chat">−</button>
            </header>
            <div class="chat-body">
                <ol id="chat-messages" aria-label="Messages du chat" aria-live="polite"></ol>
                <p id="chat-status" role="status" aria-live="polite">Connexion au chat...</p>
                <form id="chat-form">
                    <label class="visually-hidden" for="chat-input">Ton message</label>
                    <input id="chat-input" name="message" type="text" maxlength="500"
                        autocomplete="off" placeholder="Écris un message..." required>
                    <button type="submit" aria-label="Envoyer le message">➤</button>
                </form>
                <p class="chat-note">Messages temporaires · 500 caractères max.</p>
            </div>
        </aside>
    </div>

    <!-- Questions de Qui de nous ? -->
    <script src="Game/QuiDeNous/Chill.js"></script>
    <script src="Game/QuiDeNous/Soft.js"></script>
    <script src="Game/QuiDeNous/Hard.js"></script>
    <script src="Game/QuiDeNous/Extreme.js"></script>
    <!-- Questions du Test de pureté. -->
    <script src="Game/TestDePurete/Classique.js"></script>
    <script src="Game/TestDePurete/Hard.js"></script>
    <script src="Game/TestDePurete/SpecialSex.js"></script>
    <!-- Questions d'Action ou Vérité en mode 1 appareil. -->
    <script src="Game/ActionVerite/Chill.js"></script>
    <script src="Game/ActionVerite/Soft.js"></script>
    <script src="Game/ActionVerite/Hard.js"></script>
    <script src="Game/ActionVerite/Extreme.js"></script>
    <!-- Client temps réel du chat en ligne. -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Navigation principale de l'application. -->
    <script src="script.js"></script>
    <!-- Salon en ligne de Qui de nous ?. -->
    <script src="Game/QuiDeNous/QuiDeNousEnLigne.js"></script>
    <!-- Salon en ligne d'Undercover. -->
    <script src="Game/Undercover/UndercoverEnLigne.js"></script>
    <!-- Logique de Qui de nous ? et du Test de pureté. -->
    <script src="Game/QuiDeNous/QuiDeNous.js"></script>
    <script src="Game/TestDePurete/TestDePureté.js"></script>
    <script src="Game/ActionVerite/ActionVerite.js"></script>
</body>
</html>
